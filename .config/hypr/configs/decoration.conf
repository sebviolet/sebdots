general {
	gaps_in = 5
	gaps_out = 5
	border_size = 2
	col.active_border = rgba(707070ff)
	col.inactive_border = rgba(d0d0d0ff)
	col.active_border = rgba(f5c2e7ff)
	col.inactive_border = rgba(d0d0d020)
	resize_on_border = true
	#layout = scrolling

	snap {
		enabled = true
	}
}

decoration {
	rounding = 10
	active_opacity = 1.0
	inactive_opacity = 0.9
	dim_inactive = true
	dim_strength = 0.3

	shadow {
		enabled = false
		range = 30
		render_power = 5
		#color = rgba(00000070)
	}

	blur {
		enabled = true
		popups = true
		xray = true
	}
}
