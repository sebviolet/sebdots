# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=1
layer_shadows=1
shadow_only_floating=0
shadows_size=8
shadows_blur=5
shadows_position_x=-6
shadows_position_y=-6
shadowscolor= 0x000000aa

border_radius=8
borderpx=4
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.8

# Animation Configuration
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.4
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=400
animation_curve_open=0.46,1.0,0.29,1.1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.58,0.98,0.58,0.98
animation_curve_opafadein=0.46,1.0,0.29,1

# scroller configuration
scroller_structs=20
scroller_default_proportion=0.6
scroller_focus_center=0
scroller_prefer_center=1
scroller_prefer_overspread=1
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# master-stack configuration
new_is_master=1
default_mfact=0.5
default_nmaster=1
smartgaps=0

# Dwindle configuration
dwindle_split_ratio=0.5
dwindle_smart_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0
dwindle_smart_resize=0
dwindle_drop_simple_split=1
dwindle_manual_split=0

# Overview Setting
hotarea_size=5
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
xwayland_persistence=0
syncobj_enable=0
no_border_when_single=1
axis_bind_apply_timeout=100
focus_on_activate=1
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
circle_layout=dwindle,grid,scroller,tile
enable_floating_snap=1
snap_distance=50
cursor_size=24
cursor_theme=catppuccin-mocha-lavender-cursors
cursor_hide_timeout=0
drag_tile_to_tile=1
single_scratchpad=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=1
xkb_rules_layout=fr
# xkb_rules_options=ctrl:nocaps
# xkb_rules_options=grp:alt_altgr_toggle,caps:hyper

# Trackpad
disable_trackpad=1
tap_to_click=1
tap_and_drag=1
drag_lock=1
mouse_natural_scrolling=0
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1
mouse_accel_profile=2
mouse_accel_speed=0.0
# scroll_button=274
# scroll_method=1

# Appearance
gappih=1
gappiv=1
gappoh=15
gappov=15
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# sub config load
source=./env.conf
source=./bind.conf
source=./rule.conf
source=./monitor.conf
source=./startup.conf

