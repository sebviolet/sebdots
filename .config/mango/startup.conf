# Polkit
exec-once = /usr/lib/polkit-kde-authentication-agent-1 >/dev/null 2>&1 &

# some env can't auto run the portal, so need this
exec-once = /usr/lib/xdg-desktop-portal-wlr >/dev/null 2>&1 &

# Bar
exec-once = noctalia -d >/dev/null 2>&1 &

# Clipboard
exec-once = wl-paste --watch cliphist store >/dev/null 2>&1 &

exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark' >/dev/null 2>&1 &
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'catppuccin-mocha-lavender-standard+default' >/dev/null 2>&1 &

exec-once = xhost +SI:localuser:root >/dev/null 2>&1 &

# Slow app launch fix
exec-once = dbus-update-activation-environment --systemd --all >/dev/null 2>&1 &
exec-once = systemctl --user import-environment >/dev/null 2>&1 &

exec-once = systemctl --user restart xdg-desktop-portal &
