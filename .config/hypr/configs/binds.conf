$mainMod = SUPER

# Select region and save to file, then copy to clipboard
bind = , PRINT, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/Screenshot-$(date +%F_%T).png

# Full screen capture
bind = $mainMod $SHIFT, PRINT, exec, grim ~/Pictures/Screenshots/Screenshot-$(date +%F_%T).png

bind = $mainMod, RETURN, exec, foot --title main -d none
bind = $mainMod, B, exec, brave
bind = $mainMod, D, exec, fuzzel
bind = $mainMod, E, exec, thunar
bind = $mainMod, F, fullscreen,
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, X, exec, wleave
bind = $mainMod, H, exec, hyprkcs
bind = $mainMod, C, exec, cliphist list | fuzzel --dmenu --with-nth 2 | cliphist decode | wl-copy

# Change Wallpaper
bind = $mainMod, W, exec, waypaper
bind = $mainMod $SHIFT, E, exec, foot --title yazi -e yazi
bind = $mainMod $SHIFT, P, pseudo, # dwindle
bind = $mainMod $SHIFT, L, exec, hyprlock --quiet
bind = $mainMod $SHIFT, R, exec, hyprctl reload --quiet && notify-send "Done" "Hyprland reload"

# Zoom
bind = $mainMod $SHIFT, mouse_down, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') + 0.5}") # Increase display zoom
bind = $mainMod $SHIFT, mouse_up, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') - 0.5}") # Decrease display zoom
bind = $mainMod $SHIFT, Z, exec, hyprctl keyword cursor:zoom_factor 1 # Reset display zoom

#bind = $mainMod $ALT, V, exec, hyprctl --quiet dispatch workspaceopt allfloat

# Example special workspace (scratchpad)
bind = $mainMod, A, togglespecialworkspace, magic
bind = $mainMod $SHIFT, A, movetoworkspace, special:magic

# Cycle windows if floating bring to top
bind = ALT, tab, cyclenext
bind = $mainMod, G, togglegroup
bind = $mainMod $SHIFT, I, togglesplit # only works on dwindle layout
bind = $mainMod, P, pseudo, # dwindle

# Volume and Media Control
#bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
#bind = , XF86AudioLowerVolume, exec, pamixer -d 5
#bind = , XF86AudioMicMute, exec, pamixer --default-source -m
#bind = , XF86AudioMute, exec, pamixer -t
#bind = , XF86AudioPlay, exec, playerctl play-pause
#bind = , XF86AudioPause, exec, playerctl play-pause
#bind = , XF86AudioNext, exec, playerctl next
#bind = , XF86AudioPrev, exec, playerctl previous

# Screen brightness
#bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%
#bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Move focus with mainMod + arrow keys
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d

# Move active window around current workspace with mainMod + SHIFT + CTRL [←→↑↓]
bind = $mainMod $CONTROL, Left, movewindow, l
bind = $mainMod $CONTROL, Right, movewindow, r
bind = $mainMod $CONTROL, Up, movewindow, u
bind = $mainMod $CONTROL, Down, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, code:10, workspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod, code:13, workspace, 4
bind = $mainMod, code:14, workspace, 5
bind = $mainMod, code:15, workspace, 6
bind = $mainMod, code:16, workspace, 7
bind = $mainMod, code:17, workspace, 8
bind = $mainMod, code:18, workspace, 9
bind = $mainMod, code:19, workspace, 10

# Move active window to a workspace silently mainMod + CTRL [0-9]
bind = $mainMod $CONTROL, code:10, movetoworkspacesilent, 1
bind = $mainMod $CONTROL, code:11, movetoworkspacesilent, 2
bind = $mainMod $CONTROL, code:12, movetoworkspacesilent, 3
bind = $mainMod $CONTROL, code:13, movetoworkspacesilent, 4
bind = $mainMod $CONTROL, code:14, movetoworkspacesilent, 5
bind = $mainMod $CONTROL, code:15, movetoworkspacesilent, 6
bind = $mainMod $CONTROL, code:16, movetoworkspacesilent, 7
bind = $mainMod $CONTROL, code:17, movetoworkspacesilent, 8
bind = $mainMod $CONTROL, code:18, movetoworkspacesilent, 9
bind = $mainMod $CONTROL, code:19, movetoworkspacesilent, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
