# Theme
env=GTK_THEME,catppuccin-mocha-lavender-standard+default
env=XCURSOR_THEME,Catppuccin Mocha Lavender
env=XCURSOR_SIZE,24

# QT environment-variables
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_QPA_PLATFORMTHEME,qt6ct
#env=QT_STYLE_OVERRIDE,kvantum
env=QT_QPA_PLATFORMTHEME_QT6,gtk3
env=QT_SCALE_FACTOR,1
#env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=SDL_VIDEODRIVER,wayland
env=GDK_SCALE,1
env=GDK_BACKEND,wayland
env=GTK_THEME_VARIANT,dark
env=EGL_PLATFORM,wayland
env=CLUTTER_BACKEND,wayland

# XDG Specifications
env=XDG_SESSION_TYPE,wayland

# XWAYLAND (X11 Compatibility on Wayland)
env=XWAYLAND_SCALE,1

# vulkan
env=WLR_RENDERER,vulkan

# firefox
env=MOZ_ENABLE_WAYLAND,1

# electron >28 apps (may help)
env=ELECTRON_ENABLE_WAYLAND,1
env=ELECTRON_OZONE_PLATFORM_HINT,wayland
env=OZONE_PLATFORM,wayland
