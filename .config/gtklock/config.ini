[main]
gtk-theme=catppuccin-mocha-lavender-standard+default
time-format=%H:%M
date-format=%A %d / %b / %Y
start-hidden=1
modules=userinfo-module.so;powerbar-module.so

[userinfo]
round-image=true
horizontal-layout=false
under-clock=false
image-size=100

[powerbar]
show-labels=true
linked-buttons=false
reboot-command=systemctl reboot
poweroff-command=systemctl -i poweroff
suspend-command=systemctl suspend
userswitch-command=
logout-command=mmsg -q
